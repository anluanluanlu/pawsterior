name = "pawsterior-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Optional: serve the API on your own domain (the domain must be on Cloudflare).
# routes = [{ pattern = "pawsterior-api.buecking.me", custom_domain = true }]

[vars]
# Comma-separated list of origins allowed to call the API from a browser.
ALLOWED_ORIGINS = "https://pawsterior.buecking.me"
# Master switch: set to "false" to close registration for everyone.
ALLOW_SIGNUP = "true"
# Only these emails may create an account (comma-separated). To invite a friend, add their
# address here and run `wrangler deploy`. Existing accounts are not affected by this list.
ALLOWED_EMAILS = "anlu900@gmail.com"

[[kv_namespaces]]
binding = "PAWS"
id = "ab42c67c1cde4bc09bc871f470934443"
